name: Engineering acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python scripts/check_release.py
      - run: python scripts/check_secrets.py --all-files
      - run: python tools/check_install.py
      - name: Run local fixture, zero external model calls
        run: python tests/acceptance.py --output "$RUNNER_TEMP/business-research-acceptance"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: engineering-acceptance
          path: ${{ runner.temp }}/business-research-acceptance/result.json
          if-no-files-found: ignore
