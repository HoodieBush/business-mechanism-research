name: Engineering acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install Linux isolation dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          bwrap --version
          sudo sh tools/install_ubuntu_bwrap_profile.sh
      - name: Create an actual isolated Python environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python scripts/check_release.py
      - run: python scripts/check_secrets.py --all-files
      - run: python tools/check_install.py
      - name: Verify worker isolation and venv dependencies
        run: python tests/isolation.py --output "$RUNNER_TEMP/business-research-isolation"
      - name: Run local fixture, zero external model calls
        run: python tests/acceptance.py --output "$RUNNER_TEMP/business-research-acceptance"
      - name: Review repair, batch query and scientific counterexamples
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Whole update compatibility, zero external model calls
        run: python tests/update_compatibility.py --output "$RUNNER_TEMP/business-research-update-compatibility"
      - name: Business coverage and unresolved stage lifecycle, zero external model calls
        run: python tests/business_workflow.py --output "$RUNNER_TEMP/business-research-business-workflow"
      - name: Finite continuous supervisor fixture, zero external model calls
        run: python tests/continuous.py --output "$RUNNER_TEMP/business-research-continuous"
      - name: Resume with inherited costs and original deadline, zero external model calls
        run: python tests/continuation.py --output "$RUNNER_TEMP/business-research-continuation"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: engineering-acceptance-${{ runner.os }}
          path: |
            ${{ runner.temp }}/business-research-acceptance/result.json
            ${{ runner.temp }}/business-research-isolation/result.json
            ${{ runner.temp }}/business-research-continuous/result.json
            ${{ runner.temp }}/business-research-business-workflow/result.json
            ${{ runner.temp }}/business-research-continuation/result.json
            ${{ runner.temp }}/business-research-update-compatibility/result.json
            ${{ runner.temp }}/business-research-update-compatibility/contract-manifest.json
          if-no-files-found: ignore
